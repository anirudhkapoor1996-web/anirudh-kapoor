name: Instagram Publish

# Posts ONE queued project per day to @anirudh_kapoor_designs.
# Deliberately NOT triggered on push: queuing many projects and letting each
# push attempt to publish them all blew Instagram's 24h media-creation cap.
# Instead this runs once a day and publishes the single oldest un-posted project
# (scripts/ig_publish.py enforces a 20h guard, so a manual run won't double-post).

on:
  schedule:
    - cron: '30 13 * * *'   # ~19:00 IST daily (GitHub cron is UTC, may drift a few min)
  workflow_dispatch: {}     # manual "Run workflow" button for an on-demand post

permissions:
  contents: write           # to commit the .posted marker back

concurrency:
  group: ig-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Publish the next queued post (one per day)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          SITE_BASE_URL: https://anirudh-kapoor.com
        run: python scripts/ig_publish.py
      - name: Commit posted marker
        run: |
          if [ -n "$(git status --porcelain social)" ]; then
            git config user.name "akd-bot"
            git config user.email "actions@users.noreply.github.com"
            git add social
            git commit -m "Mark posted [skip ci]"
            git push
          fi
