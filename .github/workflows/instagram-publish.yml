name: Social Publish (IG / FB / LinkedIn)

on:
  push:
    branches: [main]
    paths: ['.ci-trigger']        # TEMP: lets us trigger + capture logs without the browser
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: https://anirudh-kapoor.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      - name: Instagram
        if: ${{ always() }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python scripts/ig_publish.py 2>&1 | tee social/_ig.log

      - name: Facebook Page
        if: ${{ always() }}
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python scripts/fb_publish.py 2>&1 | tee social/_fb.log

      - name: LinkedIn
        if: ${{ always() }}
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION }}
        run: python scripts/li_publish.py 2>&1 | tee social/_li.log

      - name: Token presence (names only, never values)
        if: ${{ always() }}
        run: |
          {
            echo "FB_PAGE_TOKEN set:        ${{ secrets.FB_PAGE_TOKEN != '' }}"
            echo "FB_PAGE_ID set:           ${{ secrets.FB_PAGE_ID != '' }}"
            echo "LINKEDIN_ACCESS_TOKEN set:${{ secrets.LINKEDIN_ACCESS_TOKEN != '' }}"
            echo "IG_PAGE_TOKEN set:        ${{ secrets.IG_PAGE_TOKEN != '' }}"
            echo "IG_USER_ID set:           ${{ secrets.IG_USER_ID != '' }}"
          } > social/_secrets-present.txt

      - name: Commit logs + markers
        if: ${{ always() }}
        run: |
          git config user.name "akd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A social
          if ! git diff --cached --quiet; then
            git commit -m "diag: capture publish logs [skip ci]"
            git push
          fi
