name: Social Publish

# Posts any ready, un-posted project in social/<ref>/ to all platforms:
#   Instagram (@anirudh_kapoor_designs)
#   Facebook Page (Anirudh Kapoor Designs)
#   LinkedIn
# Then archives the project folder to Google Drive once all three succeed.
#
# Fires when slides or post.json are pushed under social/, or via Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'social/**'
  schedule:
      - cron: '30 13 * * *' # ~19:00 IST daily
  workflow_dispatch: {}

permissions:
  contents: write       # commit .posted* and .drive-archived markers back

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests google-api-python-client google-auth

      # -- Instagram
      - name: Publish to Instagram
        env:
          IG_USER_ID:    ${{ secrets.IG_USER_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://anirudh-kapoor.com' }}
        run: python scripts/ig_publish.py

      # -- Facebook
      - name: Publish to Facebook
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://anirudh-kapoor.com' }}
        run: python scripts/fb_publish.py

      # -- LinkedIn
      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN:  ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID:     ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_VERSION:       ${{ vars.LINKEDIN_VERSION || '202506' }}
          SITE_BASE_URL:          ${{ vars.SITE_BASE_URL || 'https://anirudh-kapoor.com' }}
        run: python scripts/li_publish.py

      # -- Google Drive archival
      # Runs even if a publishing step failed — drive_archive.py only archives
      # projects that have ALL required markers (.posted + .posted-fb + .posted-li).
      - name: Archive to Google Drive
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ARCHIVE_FOLDER_ID:      ${{ vars.DRIVE_ARCHIVE_FOLDER_ID || '1vWU62Br4t93mcMENTFxaxlaslAEF6nQ3' }}
          GOOGLE_OAUTH_CLIENT_ID:       ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET:   ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN:   ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/drive_archive.py

      # -- Commit all markers back
      - name: Commit posted markers and archive records
        if: always()
        run: |
          if [ -n "$(git status --porcelain social)" ]; then
            git config user.name "akd-bot"
            git config user.email "actions@users.noreply.github.com"
            git add social
            git commit -m "Mark posted [skip ci]"
            git push
          fi
