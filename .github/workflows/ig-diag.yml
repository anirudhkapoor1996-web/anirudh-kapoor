name: IG Diagnostics
on:
  push:
    paths: ['scripts/ig_diag.py']
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python scripts/ig_diag.py
