const CATS = ['All','Interiors','Product','Exhibition','Signage','Branding','AI & Systems','Web','Writing','Research','Real Estate'];

const rowsEl = document.getElementById('rows');
const filtersEl = document.getElementById('filters');
const countEl = document.getElementById('count');
const noresultEl = document.getElementById('noresult');
const sortBtn = document.getElementById('sortbtn');
let active = 'All';
let sortDesc = true;

document.getElementById('total').textContent = ENTRIES.length;

CATS.forEach(c=>{
  const b = document.createElement('span');
  b.className = 'fchip' + (c==='All'?' on':'');
  b.textContent = c; b.dataset.cat = c;
  b.addEventListener('click', ()=>{ active=c; document.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on', x.dataset.cat===c)); render(); });
  filtersEl.appendChild(b);
});

function render(){
  const list = ENTRIES
    .filter(e => active==='All' || e.cat===active)
    .sort((a,b)=>{ const ay=a.yr??-Infinity, by=b.yr??-Infinity; return sortDesc ? by-ay : ay-by; });
  rowsEl.innerHTML = list.map(e=>{
    const tag = e.href ? 'a' : 'div';
    const hrefAttr = e.href ? ` href="${e.href}"` : '';
    return `<${tag} class="irow"${hrefAttr}>
      <span class="r-ref">${e.ref}</span>
      <span class="r-title">${e.title}<span class="ar"> →</span></span>
      <span class="r-disc">${e.cat}</span>
      <span class="r-detail">${e.detail}</span>
      <span class="r-yr">${e.yr ?? '—'}</span>
    </${tag}>`;
  }).join('');
  countEl.textContent = list.length + (active==='All'?' entries':' in '+active);
  noresultEl.style.display = list.length ? 'none' : 'block';
}

sortBtn.addEventListener('click', ()=>{ sortDesc=!sortDesc; sortBtn.textContent = 'Year ' + (sortDesc?'↓':'↑'); render(); });

render();
