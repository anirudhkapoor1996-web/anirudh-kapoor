<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Export OS</title>
<meta name="description" content="Export OS: buyers, samples, quotes, shipments, follow-ups and export paperwork for Indian exporters. Your data stays on your device.">
<meta name="theme-color" content="#20231e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Export OS">
<style>
:root{--paper:#ece9e3;--panel:#f7f5f0;--deep:#e2ded5;--ink:#20231e;--ink2:#3b3f38;--soft:#62665e;--sage:#55705a;--warn:#9a5a1e;--bad:#9b2f2f;--line:rgba(32,35,30,.14);
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#171916;--panel:#20231f;--deep:#2a2e29;--ink:#ecebe6;--ink2:#cfcfc8;--soft:#9da197;--sage:#8fb196;--warn:#e0a15e;--bad:#e07b7b;--line:rgba(236,235,230,.14)}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
header b{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:.01em}header small{font-family:var(--mono);font-size:11px;opacity:.7}
header .sp{flex:1}#installBtn{display:none;background:transparent;border:1px solid var(--paper);color:var(--paper);border-radius:3px;padding:6px 10px;font-size:13px;cursor:pointer}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--deep);border-bottom:1px solid var(--line);padding:0 8px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;text-decoration:none;padding:11px 12px;font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--soft);border-bottom:2px solid transparent}nav a.on{color:var(--ink);border-color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:6px 0 12px}h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin:22px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:3px;cursor:pointer;text-decoration:none;font-size:14px;font-weight:500}
.btn.g{background:transparent;color:var(--ink)}.btn.s{padding:5px 10px;font-size:13px}.btn.d{border-color:var(--bad);background:transparent;color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:8px 0}
.item{display:flex;gap:10px;align-items:flex-start;text-decoration:none}.item .t{font-weight:600}.item .m{font-size:13px;color:var(--soft)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:3px;background:rgba(85,112,90,.15);color:var(--sage);white-space:nowrap}
.tag.w{background:rgba(154,90,30,.14);color:var(--warn)}.tag.b{background:rgba(155,47,47,.13);color:var(--bad)}
.empty{color:var(--soft);padding:18px 4px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:9px 10px}
textarea{min-height:80px;resize:vertical}label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin:12px 0 4px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.stats .card b{display:block;font-family:var(--serif);font-weight:400;font-size:26px}.stats .card span{font-size:12px;color:var(--soft)}
table.lines{width:100%;border-collapse:collapse;font-size:14px}table.lines th{text-align:left;font-size:11px;color:var(--soft);font-weight:600;padding:4px}table.lines td{padding:3px 4px;vertical-align:top}table.lines input{padding:6px}
.note{font-size:13px;color:var(--soft)}.fl{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.fl a{font-size:13px;text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:20px}.fl a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
#print{display:none}
@media print{header,nav,main,.toast{display:none!important}#print{display:block;color:#000;font-family:var(--serif);font-size:12pt}body{background:#fff}}
#print h1{font-size:22pt;margin:0}#print table{width:100%;border-collapse:collapse;margin-top:12pt}#print td,#print th{border:1px solid #999;padding:5pt;text-align:left;font-size:10.5pt}#print .r{text-align:right}#print .hd{display:flex;justify-content:space-between;gap:20pt}#print .sm{font-size:9.5pt;color:#333}
</style>
</head>
<body>
<header><b>Export OS</b><small id="ver"></small><span class="sp"></span><button id="installBtn">Install app</button></header>
<nav id="nav"></nav>
<main id="app"><p class="empty">Loading…</p></main>
<div id="print"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const VERSION='0.1.0';
document.getElementById('ver').textContent='v'+VERSION;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function money(v,c){const n=Number(v)||0;try{return new Intl.NumberFormat('en-IN',{style:'currency',currency:c||'USD',maximumFractionDigits:2}).format(n)}catch(e){return (c||'')+' '+n.toFixed(2)}}
function fdate(d){if(!d)return '';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}

/* ---------- storage: IndexedDB, everything stays on this device ---------- */
let DB;const R=new Map();
function idb(){return new Promise((ok,no)=>{const q=indexedDB.open('exportos',1);q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('rec',{keyPath:'id'});d.createObjectStore('files',{keyPath:'id'})};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
function tx(store,mode,fn){return new Promise((ok,no)=>{const t=DB.transaction(store,mode);const s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}
async function loadAll(){const all=await new Promise((ok,no)=>{const q=DB.transaction('rec').objectStore('rec').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});R.clear();all.forEach(r=>R.set(r.id,r))}
async function put(r){r.updated=new Date().toISOString();if(!r.created)r.created=r.updated;R.set(r.id,r);await tx('rec','readwrite',s=>s.put(r));return r}
async function del(id){R.delete(id);await tx('rec','readwrite',s=>s.delete(id));for(const f of await filesFor(id))await tx('files','readwrite',s=>s.delete(f.id))}
const all=t=>[...R.values()].filter(r=>r.t===t);
const get=id=>R.get(id);
function filesFor(ref){return new Promise((ok,no)=>{const q=DB.transaction('files').objectStore('files').getAll();q.onsuccess=()=>ok(q.result.filter(f=>f.ref===ref));q.onerror=()=>no(q.error)})}
function allFiles(){return new Promise((ok,no)=>{const q=DB.transaction('files').objectStore('files').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
const S=()=>get('settings')||{id:'settings',t:'settings',me:'',company:'',address:'',iec:'',gstin:'',ad:'',lut:'',bank:'',email:'',phone:'',cur:'USD',seq:{}};

/* ---------- what each record holds ---------- */
const CUR=['USD','EUR','GBP','AED','AUD','CAD','SGD','JPY','CHF','SAR','INR'];
const STAGES=['New','Contacted','Interested','Sample sent','Negotiating','Ordered','Repeat buyer','Lost'];
const SCHEMA={
 buyer:{name:'Buyer',plural:'Buyers',title:r=>r.company||r.contact||'Unnamed buyer',fields:[
  ['company','Company','text'],['contact','Contact person','text'],['email','Email','email'],['phone','WhatsApp / phone (with country code)','tel'],
  ['country','Country','text'],['kind','Type','select',['Importer','Distributor','Wholesaler','Retailer','Buying agent','Private label','Marketplace','Individual']],
  ['stage','Stage','select',STAGES],['interest','What they buy','text'],['value','Expected order value','number'],['cur','Currency','select',CUR],
  ['source','Where they came from','select',['Referral','Trade show','Website','Instagram','LinkedIn','Marketplace enquiry','Cold outreach','Buying house','Other']],
  ['owner','Owner','text'],['tz','Their time zone / best time','text'],['notes','Notes','textarea']]},
 sample:{name:'Sample',plural:'Samples',title:r=>(get(r.buyer)?SCHEMA.buyer.title(get(r.buyer)):'No buyer')+' · '+(r.items||'sample'),fields:[
  ['buyer','Buyer','buyer'],['items','What was sent','text'],['sent','Sent on','date'],['courier','Courier','text'],['awb','Tracking / AWB no.','text'],
  ['cost','Sample + courier cost (INR)','number'],['charged','Charged to buyer','select',['No','Yes, adjusted in first order','Yes, paid']],
  ['due','Ask for feedback on','date'],['status','Status','select',['Preparing','Sent','Delivered','Feedback received','Converted to order','No interest']],['feedback','Feedback','textarea']]},
 quote:{name:'Quote',plural:'Quotes',title:r=>(r.no||'Quote')+' · '+(get(r.buyer)?SCHEMA.buyer.title(get(r.buyer)):''),fields:[
  ['buyer','Buyer','buyer'],['no','Proforma no.','text'],['date','Date','date'],['valid','Valid until','date'],['cur','Currency','select',CUR],
  ['inco','Incoterms','select',['EXW','FCA','FOB','CFR','CIF','CPT','CIP','DAP','DDP']],['port','Port / place','text'],
  ['pay','Payment terms','select',['100% advance','50% advance, 50% before dispatch','30% advance, 70% against documents','Letter of credit','Cash against documents','Other']],
  ['lead','Production / dispatch time','text'],['freight','Freight and insurance','number'],['status','Status','select',['Draft','Sent','Accepted','Rejected','Expired']],['terms','Other terms','textarea']]},
 shipment:{name:'Shipment',plural:'Shipments',title:r=>(r.inv||'Shipment')+' · '+(get(r.buyer)?SCHEMA.buyer.title(get(r.buyer)):''),fields:[
  ['buyer','Buyer','buyer'],['quote','From quote','quote'],['inv','Invoice no.','text'],['invdate','Invoice date','date'],['cur','Currency','select',CUR],['value','Invoice value','number'],
  ['mode','Mode','select',['Air','Sea','Courier','Post (Dak Ghar Niryat)','Road']],['carrier','Carrier / forwarder','text'],['awb','AWB / bill of lading no.','text'],
  ['sb','Shipping bill no.','text'],['sbdate','Shipping bill date','date'],['lut','Under LUT (no IGST paid)','select',['Yes','No - IGST paid','Not sure']],
  ['shipped','Shipped on','date'],['eta','Expected delivery','date'],['status','Status','select',['Packing','Documents ready','Shipped','In transit','Delivered','Paid','Closed']],
  ['paid','Payment received','select',['Not yet','Part','Full']],['paidon','Payment received on','date'],['brc','Payment realisation (e-BRC/FIRC) on file','select',['No','Yes']],['notes','Notes','textarea']]},
 follow:{name:'Follow-up',plural:'Follow-ups',title:r=>r.action||'Follow-up',fields:[['buyer','Buyer','buyer'],['due','When','date'],['action','What to do','text'],['owner','Owner','text'],['notes','Notes','textarea']]},
 item:{name:'Product',plural:'Catalogue',title:r=>(r.sku?r.sku+' · ':'')+(r.name||'Product'),fields:[
  ['sku','SKU','text'],['name','Name','text'],['cat','Category','text'],['hs','HS code','text'],['material','Material','text'],['weight','Weight per piece (g)','number'],
  ['cost','Cost (INR)','number'],['price','Price per piece','number'],['cur','Currency','select',CUR],['moq','MOQ (pieces)','number'],['supplier','Maker / supplier','supplier'],['lead','Lead time (days)','number'],['notes','Notes','textarea']]},
 supplier:{name:'Maker',plural:'Makers',title:r=>r.name||'Maker',fields:[['name','Name / workshop','text'],['city','City / cluster','text'],['phone','Phone','tel'],['speciality','Speciality','text'],
  ['moq','MOQ','text'],['lead','Usual lead time (days)','number'],['rating','Quality (1-5)','select',['','1','2','3','4','5']],['pay','How they are paid','text'],['gstin','GSTIN','text'],['notes','Notes','textarea']]},
 comp:{name:'Paperwork item',plural:'Paperwork',title:r=>r.name||'Item',fields:[['name','What','text'],['due','Next due','date'],['repeat','Repeats','select',['Every year','Every 5 years','Once','Every month']],['status','Status','select',['To do','Done for this period']],['notes','Notes / reference no.','textarea']]}
};
const SEED_COMP=[
 ['IEC annual update on the DGFT portal','Every year','Done between April and June each year, even when nothing changed, or the IEC can be deactivated. Check the current rule on dgft.gov.in.',6,30],
 ['GST LUT (Form RFD-11) for the new financial year','Every year','Lets you export without paying IGST. File it in April, before the first export of the year. Confirm with your CA.',4,30],
 ['Export promotion council membership / RCMC renewal','Every year','For example GJEPC for gems and jewellery, EPCH for handicrafts. Check your council\'s renewal date.',4,30],
 ['AD code registered with the port or courier terminal (ICEGATE)','Once','Your bank gives the AD code letter; it is registered on ICEGATE for each port you ship from.',0,0],
 ['Monthly papers to the CA (invoices, shipping bills, payment proofs)','Every month','Settings > Month-end pack makes the list.',0,0]];

/* ---------- small helpers ---------- */
function nextNo(prefix){const s=S();s.seq=s.seq||{};const y=new Date().getFullYear();const k=prefix+y;s.seq[k]=(s.seq[k]||0)+1;put(s);return `${prefix}-${y}-${String(s.seq[k]).padStart(3,'0')}`}
function quoteTotal(q){const lines=q.lines||[];return lines.reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.price)||0),0)+(Number(q.freight)||0)}
function buyerName(id){const b=get(id);return b?SCHEMA.buyer.title(b):''}
function waLink(p){const n=String(p||'').replace(/[^0-9]/g,'');return n?'https://wa.me/'+n:''}
function stageTag(s){const c=s==='Lost'?'b':(s==='Ordered'||s==='Repeat buyer')?'':'w';return `<span class="tag ${c}">${esc(s||'New')}</span>`}
function dueTag(d){if(!d)return '';const t=today();const c=d<t?'b':d===t?'w':'';return `<span class="tag ${c}">${d<t?'overdue · ':d===t?'today · ':''}${esc(fdate(d))}</span>`}

/* ---------- views ---------- */
const TABS=[['today','Today'],['buyers','Buyers'],['samples','Samples'],['quotes','Quotes'],['shipments','Shipments'],['catalogue','Catalogue'],['makers','Makers'],['paperwork','Paperwork'],['settings','Settings']];
const LISTMAP={buyers:'buyer',samples:'sample',quotes:'quote',shipments:'shipment',catalogue:'item',makers:'supplier',paperwork:'comp'};
function navRender(cur){$('#nav').innerHTML=TABS.map(([k,l])=>`<a href="#${k}" class="${cur===k?'on':''}">${l}</a>`).join('')}
function route(){const h=decodeURIComponent(location.hash.slice(1))||'today';const [v,...a]=h.split('/');const q=new URLSearchParams(h.split('?')[1]||'');
 const tab=LISTMAP[v]||v==='today'||v==='settings'?v:(v==='buyer'?'buyers':v==='edit'?Object.keys(LISTMAP).find(k=>LISTMAP[k]===a[0].split('?')[0])||'today':'today');navRender(tab);window.scrollTo(0,0);
 try{if(v==='today')return vToday();if(LISTMAP[v])return vList(LISTMAP[v],q);if(v==='buyer')return vBuyer(a[0]);if(v==='edit')return vEdit(a[0].split('?')[0],(a[1]||'new').split('?')[0],q);if(v==='settings')return vSettings();vToday()}catch(e){console.error(e);$('#app').innerHTML=`<p class="empty">Something went wrong: ${esc(e.message)}</p>`}}
window.addEventListener('hashchange',route);

function vToday(){const t=today();
 const fu=all('follow').filter(f=>!f.done&&f.due&&f.due<=t).sort((a,b)=>a.due.localeCompare(b.due));
 const sm=all('sample').filter(s=>['Sent','Delivered'].includes(s.status)&&s.due&&s.due<=t);
 const sh=all('shipment').filter(s=>!['Paid','Closed'].includes(s.status));
 const cp=all('comp').filter(c=>c.due&&c.status!=='Done for this period'&&c.due<=addDays(t,45));
 const qs=all('quote').filter(q=>q.status==='Sent'&&q.valid&&q.valid<=addDays(t,3));
 const open=all('buyer').filter(b=>!['Lost','Ordered','Repeat buyer'].includes(b.stage));
 const pipe={};open.forEach(b=>{const c=b.cur||S().cur||'USD';pipe[c]=(pipe[c]||0)+(Number(b.value)||0)});
 const noNext=open.filter(b=>!all('follow').some(f=>f.buyer===b.id&&!f.done));
 let h=`<h1>${esc(S().me?'Good day, '+S().me.split(' ')[0]:'Today')}</h1>
 <div class="stats"><div class="card"><b>${fu.length}</b><span>follow-ups due</span></div><div class="card"><b>${sm.length}</b><span>samples waiting for feedback</span></div>
 <div class="card"><b>${sh.length}</b><span>shipments open</span></div><div class="card"><b>${Object.entries(pipe).map(([c,v])=>money(v,c)).join(' + ')||'—'}</b><span>open deals (${open.length} buyers)</span></div></div>`;
 h+=`<h2>Follow up today</h2>`+(fu.length?fu.map(f=>`<div class="card item"><div class="sp"><a class="t" href="#buyer/${f.buyer}">${esc(buyerName(f.buyer)||'No buyer')}</a><div>${esc(f.action)}</div><div class="m">${dueTag(f.due)} ${f.owner?esc(f.owner):''}</div></div><button class="btn s" data-done="${f.id}">Done</button></div>`).join(''):`<p class="empty">Nothing due. Every open buyer should have a next step with a date.</p>`);
 if(noNext.length)h+=`<h2>Open buyers with no next step</h2>`+noNext.slice(0,10).map(b=>`<a class="card item" href="#buyer/${b.id}"><div class="sp"><div class="t">${esc(SCHEMA.buyer.title(b))}</div><div class="m">${esc(b.country||'')} ${stageTag(b.stage)}</div></div><span class="tag w">add a follow-up</span></a>`).join('');
 if(sm.length)h+=`<h2>Ask for sample feedback</h2>`+sm.map(s=>`<a class="card item" href="#edit/sample/${s.id}"><div class="sp"><div class="t">${esc(buyerName(s.buyer))}</div><div class="m">${esc(s.items||'')} · sent ${esc(fdate(s.sent))} ${dueTag(s.due)}</div></div></a>`).join('');
 if(qs.length)h+=`<h2>Quotes about to expire</h2>`+qs.map(q=>`<a class="card item" href="#edit/quote/${q.id}"><div class="sp"><div class="t">${esc(SCHEMA.quote.title(q))}</div><div class="m">${money(quoteTotal(q),q.cur)} · valid until ${esc(fdate(q.valid))}</div></div></a>`).join('');
 if(sh.length)h+=`<h2>Shipments open</h2>`+sh.map(s=>`<a class="card item" href="#edit/shipment/${s.id}"><div class="sp"><div class="t">${esc(SCHEMA.shipment.title(s))}</div><div class="m">${esc(s.mode||'')} ${esc(s.awb||'')} · <span class="tag">${esc(s.status||'Packing')}</span> ${s.eta?'· due '+esc(fdate(s.eta)):''}</div></div></a>`).join('');
 if(cp.length)h+=`<h2>Paperwork due soon</h2>`+cp.map(c=>`<a class="card item" href="#edit/comp/${c.id}"><div class="sp"><div class="t">${esc(c.name)}</div><div class="m">${dueTag(c.due)}</div></div></a>`).join('');
 if(!all('buyer').length)h+=`<div class="card"><b>Start with the ten buyers that matter.</b><p class="note">Add them one by one, or bring a list from a spreadsheet (Settings &gt; Import buyers from CSV).</p><div class="row"><a class="btn" href="#edit/buyer/new">Add a buyer</a><a class="btn g" href="#settings">Import a list</a></div></div>`;
 $('#app').innerHTML=h;
 document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>doneFollow(b.dataset.done));}

async function doneFollow(id){const f=get(id);if(!f)return;f.done=today();await put(f);
 const next=prompt('Done. What is the next step with '+(buyerName(f.buyer)||'this buyer')+'? (leave empty for none)','');
 if(next){const days=Number(prompt('In how many days?','3'))||3;await put({id:uid(),t:'follow',buyer:f.buyer,action:next,due:addDays(today(),days),owner:f.owner||S().me})}
 toast('Marked done');route()}

function vList(type,q){const sc=SCHEMA[type];let rows=all(type);const term=(q.get('q')||'').toLowerCase();const st=q.get('stage')||'';
 if(type==='buyer'&&st)rows=rows.filter(r=>(r.stage||'New')===st);
 if(term)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(term));
 rows.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
 if(type==='comp')rows.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
 const tab=Object.keys(LISTMAP).find(k=>LISTMAP[k]===type);
 let h=`<div class="row"><h1 class="sp">${sc.plural}</h1><a class="btn" href="#edit/${type}/new">Add ${sc.name.toLowerCase()}</a></div>
 <input type="search" id="srch" placeholder="Search ${sc.plural.toLowerCase()}" value="${esc(term)}">`;
 if(type==='buyer')h+=`<div class="fl">${['',...STAGES].map(s=>`<a href="#buyers?stage=${encodeURIComponent(s)}" class="${s===st?'on':''}">${s||'All'} ${s?'('+all('buyer').filter(b=>(b.stage||'New')===s).length+')':''}</a>`).join('')}</div>`;
 h+=rows.length?rows.map(r=>row(type,r)).join(''):`<p class="empty">No ${sc.plural.toLowerCase()} yet.</p>`;

function toCSV(head,rows){const c=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return [head,...rows].map(r=>r.map(c).join(',')).join('\r\n')}
function dl(name,data,type){const b=data instanceof Blob?data:new Blob(['﻿'+data],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function parseCSV(t){const out=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))out.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x.trim()))out.push(row);return out}
async function importCSV(file){if(!file)return;const rows=parseCSV(await file.text());if(rows.length<2){toast('No rows found');return}
 const h=rows[0].map(x=>x.trim().toLowerCase());const col=(...ns)=>h.findIndex(x=>ns.some(n=>x===n||x.includes(n)));
 const ix={company:col('company','business','firm'),contact:col('contact','name'),email:col('email'),phone:col('phone','whatsapp','mobile'),country:col('country'),interest:col('interest','product'),value:col('value','amount'),cur:col('currency'),stage:col('stage','status'),notes:col('notes','remarks')};
 let n=0;for(const r of rows.slice(1)){const g=k=>ix[k]>=0?(r[ix[k]]||'').trim():'';if(!g('company')&&!g('contact')&&!g('email'))continue;const st=STAGES.find(s=>s.toLowerCase()===g('stage').toLowerCase())||'New';
  await put({id:uid(),t:'buyer',company:g('company'),contact:g('contact'),email:g('email'),phone:g('phone'),country:g('country'),interest:g('interest'),value:g('value').replace(/[^0-9.]/g,''),cur:CUR.includes(g('cur').toUpperCase())?g('cur').toUpperCase():(S().cur||'USD'),stage:st,notes:g('notes'),owner:S().me,source:'Other'});n++}
 toast(n+' buyers imported');location.hash='buyers'}
const b64=blob=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(blob)});
async function backup(){const files=await allFiles();const fs=[];for(const f of files)fs.push({...f,blob:await b64(f.blob)});
 dl(`exportos-backup-${today()}.json`,new Blob([JSON.stringify({app:'Export OS',version:VERSION,at:new Date().toISOString(),records:[...R.values()],files:fs})],{type:'application/json'}));toast('Backup downloaded')}
async function restore(file){if(!file)return;let j;try{j=JSON.parse(await file.text())}catch(e){toast('That is not an Export OS backup');return}
 if(j.app!=='Export OS'||!Array.isArray(j.records)){toast('That is not an Export OS backup');return}
 if(!confirm(`Replace everything on this device with the backup from ${fdate((j.at||'').slice(0,10))}? (${j.records.length} records)`))return;
 await tx('rec','readwrite',s=>s.clear());await tx('files','readwrite',s=>s.clear());for(const r of j.records)await tx('rec','readwrite',s=>s.put(r));
 for(const f of j.files||[]){const blob=await (await fetch(f.blob)).blob();await tx('files','readwrite',s=>s.put({...f,blob}))}await loadAll();toast('Restored');location.hash='today';route()}

/* ---------- install + offline ---------- */
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#installBtn').style.display='inline-block'});
$('#installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#installBtn').style.display='none'};
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});

(async()=>{try{DB=await idb();await loadAll();
 if(!get('settings'))await put(S());
 if(!all('comp').length){const y=new Date().getFullYear();for(const [name,repeat,notes,mo,d] of SEED_COMP){let due='';if(mo){due=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(due<today())due=`${y+1}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}await put({id:uid(),t:'comp',name,repeat,notes,due,status:'To do'})}}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 route()}catch(e){$('#app').innerHTML=`<p class="empty">Export OS could not open its storage on this device (${esc(e.message)}). Private browsing windows block it; open it in a normal window.</p>`}})();
</script>
